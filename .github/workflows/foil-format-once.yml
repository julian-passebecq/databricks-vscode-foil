name: FOIL Format Once

on:
  push:
    branches: [foil-lab-mvp]
    paths:
      - ".github/workflows/foil-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foil-lab-mvp
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - name: Apply repository formatter
        working-directory: packages/databricks-vscode
        run: yarn run fix
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/databricks-vscode
          git commit -m "style(foil-lab): apply repository formatter"
          git push origin HEAD:foil-lab-mvp
